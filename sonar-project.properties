sonar.projectKey=AbirDas1048_upokul
sonar.organization=abirdas1048

# Scan EVERYTHING (Laravel + frontend + public assets)
sonar.sources=app,resources,routes,public

# Tests folder
sonar.tests=tests

# Exclude noise / dependencies / build artifacts
sonar.exclusions=\
vendor/**,\
storage/**,\
bootstrap/cache/**,\
public/build/**,\
public/hot,\
public/vendor/**,\
public/fonts/**,\
public/images/**,\
public/home/images/**,\
public/home/videos/**,\
**/*.png,\
**/*.jpg,\
**/*.jpeg,\
**/*.gif,\
**/*.svg,\
**/*.ico,\
**/*.ttf,\
**/*.woff,\
**/*.woff2,\
**/*.eot,\
**/*.mp4

# Encoding
sonar.sourceEncoding=UTF-8

# PHPUnit reports
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results.xml

# Exclude frontend files from coverage calculation
sonar.coverage.exclusions=\
resources/js/**,\
resources/css/**,\
resources/views/**
