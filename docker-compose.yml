services:

  # ── Laravel Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upokul_app
    restart: unless-stopped
    ports:
      - "8080:80"         # Visit: http://localhost:8080
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/html/storage   # Persist uploaded files & logs
    networks:
      - upokul_network
    depends_on:
      mysql:
        condition: service_healthy        # Wait until MySQL is truly ready

  # ── MySQL Database ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: upokul_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: upokul_travels
    ports:
      - "3307:3306"       # Use port 3307 on your PC to avoid conflict with Laragon
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - upokul_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ── phpMyAdmin (Database GUI) ────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: upokul_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"         # Visit: http://localhost:8081
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - upokul_network
    depends_on:
      - mysql

# ── Volumes & Networks ───────────────────────────────────────────────────────
volumes:
  mysql_data:

networks:
  upokul_network:
    driver: bridge
