services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: upokul_app_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - upokul_network
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:20-alpine
    container_name: upokul_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - upokul_network

  mysql:
    image: mysql:8.0
    container_name: upokul_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: upokul_travels
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - upokul_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: upokul_phpmyadmin_dev
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - upokul_network
    depends_on:
      - mysql

volumes:
  mysql_data_dev:
  vendor_data:
  node_modules_data:

networks:
  upokul_network:
    driver: bridge
